name: Auto Release APK & OTA (Pola Setel)

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'package.json'
      - 'src/**'

jobs:
  build-and-release:
    name: Build Web & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Production
        run: npm run build

      - name: Read Version Info
        id: version_info
        run: |
          VERSION_CODE=$(node -p "require('./version.json').version_code")
          VERSION_NAME=$(node -p "require('./version.json').version_name")
          CHANGELOG=$(node -p "require('./version.json').changelog || 'Pembaruan otomatis'")
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      # Pola Setel: Validasi versionCode wajib lebih tinggi dari rilis sebelumnya
      - name: Check Keystore Secrets Presence
        id: keystore_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::notice ::GitHub Secrets untuk keystore belum dipasang. APK akan disiapkan saat keystore dikonfigurasi."
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}"
          name: "Buku Konter v${{ steps.version_info.outputs.name }} (Build ${{ steps.version_info.outputs.code }})"
          body: |
            ### Pembaruan Buku Konter
            **Versi:** ${{ steps.version_info.outputs.name }}
            **Build Code:** ${{ steps.version_info.outputs.code }}

            ### Catatan Rilis:
            ${{ steps.version_info.outputs.changelog }}

            ---
            *Rilis dibuat otomatis oleh CI/CD GitHub Actions sesuai standar pola Setel.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
