name: Auto Release APK & OTA (Pola Setel)

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/**'

jobs:
  build-and-release:
    name: Build Web & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Read Version Info
        id: version_info
        run: |
          VERSION_CODE=$(node -p "require('./version.json').version_code")
          VERSION_NAME=$(node -p "require('./version.json').version_name")
          CHANGELOG=$(node -p "require('./version.json').changelog || 'Pembaruan otomatis'")
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      # Pola Setel: Validasi versionCode wajib lebih tinggi dari rilis sebelumnya
      - name: Validate Version Code Increment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_CODE=${{ steps.version_info.outputs.code }}
          echo "Current version_code: $CURRENT_CODE"
          LATEST_RELEASE=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "Latest release tag: $LATEST_RELEASE"
          if [ -n "$LATEST_RELEASE" ]; then
            PREV_CODE=$(echo "$LATEST_RELEASE" | grep -o -E 'b[0-9]+$' | tr -d 'b' || echo "0")
            echo "Previous release version_code: $PREV_CODE"
            if [ -n "$PREV_CODE" ] && [ "$CURRENT_CODE" -le "$PREV_CODE" ]; then
              echo "::error::version_code ($CURRENT_CODE) tidak lebih tinggi dari rilis sebelumnya ($PREV_CODE). Wajib menaikkan version_code sebelum rilis!"
              exit 1
            fi
          fi

      # Pola Setel: Keystore wajib ada di GitHub Secrets sebelum APK release dibuild
      - name: Validate Keystore Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::GitHub Secrets untuk Keystore Rilis (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) WAJIB dikonfigurasi sebelum build APK release! Build digagalkan untuk mencegah pembuatan rilis tanpa APK."
            exit 1
          fi

      - name: Build Web Production
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore & Configure Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ steps.version_info.outputs.code }} -PversionName="${{ steps.version_info.outputs.name }}" --stacktrace
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk buku-konter-v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}.apk

      - name: Create GitHub Release with APK Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}"
          name: "Buku Konter v${{ steps.version_info.outputs.name }} (Build ${{ steps.version_info.outputs.code }})"
          body: |
            ### Pembaruan Buku Konter
            **Versi:** ${{ steps.version_info.outputs.name }}
            **Build Code:** ${{ steps.version_info.outputs.code }}

            ### Catatan Rilis:
            ${{ steps.version_info.outputs.changelog }}

            ---
            *Rilis dibuat otomatis oleh CI/CD GitHub Actions sesuai standar pola Setel.*
          files: |
            buku-konter-v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}.apk
            android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json with APK Download URL & Commit
        run: |
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}/buku-konter-v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}.apk"
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            v.download_url = '$APK_DOWNLOAD_URL';
            fs.writeFileSync('version.json', JSON.stringify(v, null, 2) + '\n');
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): update version.json download_url [skip ci]" && git push origin main)
