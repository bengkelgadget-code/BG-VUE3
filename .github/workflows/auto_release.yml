name: Auto Release APK & OTA (Pola Setel)

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/**'

jobs:
  build-and-release:
    name: Build Web & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci

      - name: Patch Capgo Native Plugin
        run: node scripts/patch-capgo.js

      - name: Verify Capgo Native Patch
        run: |
          node -e "
            const fs = require('fs');
            const pluginFile = 'node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/CapacitorUpdaterPlugin.java';
            const updaterFile = 'node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/CapgoUpdater.java';
            const pluginContent = fs.readFileSync(pluginFile, 'utf8');
            const updaterContent = fs.readFileSync(updaterFile, 'utf8');
            if (pluginContent.includes('Checksum required')) {
              console.error('CapacitorUpdaterPlugin.java still contains Checksum required!');
              process.exit(1);
            }
            if (updaterContent.includes('Checksum required')) {
              console.error('CapgoUpdater.java still contains Checksum required!');
              process.exit(1);
            }
            const pOpen = (pluginContent.match(/\{/g) || []).length;
            const pClose = (pluginContent.match(/\}/g) || []).length;
            if (pOpen !== pClose) {
              console.error('CapacitorUpdaterPlugin.java braces unbalanced! {=' + pOpen + ', }=' + pClose);
              process.exit(1);
            }
            const uOpen = (updaterContent.match(/\{/g) || []).length;
            const uClose = (updaterContent.match(/\}/g) || []).length;
            if (uOpen !== uClose) {
              console.error('CapgoUpdater.java braces unbalanced! {=' + uOpen + ', }=' + uClose);
              process.exit(1);
            }
            console.log('Capgo native patches and brace balances verified successfully.');
          "
          # Cek sintaks Java pada CapgoUpdater.java untuk memastikan tidak ada error parse
          JAVAC_OUT=$(javac -encoding UTF-8 "node_modules/@capgo/capacitor-updater/android/src/main/java/ee/forgr/capacitor_updater/CapgoUpdater.java" 2>&1 || true)
          if echo "$JAVAC_OUT" | grep -E "class, interface, enum, or record expected|reached end of file while parsing|unnamed class"; then
            echo "::error::Parse error terdeteksi pada CapgoUpdater.java hasil patch!"
            exit 1
          fi
          echo "Verifikasi sintaks Java CapgoUpdater.java lolos (tidak ada error parse)."

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Read Version Info
        id: version_info
        run: |
          VERSION_CODE=$(node -p "require('./version.json').version_code")
          VERSION_NAME=$(node -p "require('./version.json').version_name")
          CHANGELOG=$(node -p "require('./version.json').changelog || 'Pembaruan otomatis'")
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      # Pola Setel: Validasi versionCode wajib lebih tinggi dari rilis sebelumnya
      - name: Validate Version Code Increment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_CODE=${{ steps.version_info.outputs.code }}
          echo "Current version_code: $CURRENT_CODE"
          LATEST_RELEASE=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "Latest release tag: $LATEST_RELEASE"
          if [ -n "$LATEST_RELEASE" ]; then
            PREV_CODE=$(echo "$LATEST_RELEASE" | grep -o -E 'b[0-9]+$' | tr -d 'b' || echo "0")
            echo "Previous release version_code: $PREV_CODE"
            if [ -n "$PREV_CODE" ] && [ "$CURRENT_CODE" -le "$PREV_CODE" ]; then
              echo "::error::version_code ($CURRENT_CODE) tidak lebih tinggi dari rilis sebelumnya ($PREV_CODE). Wajib menaikkan version_code sebelum rilis!"
              exit 1
            fi
          fi

      # Pola Setel: Keystore wajib ada di GitHub Secrets sebelum APK release dibuild
      - name: Validate Keystore Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::GitHub Secrets untuk Keystore Rilis (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) WAJIB dikonfigurasi sebelum build APK release! Build digagalkan untuk mencegah pembuatan rilis tanpa APK."
            exit 1
          fi

      - name: Build Web Production
        run: npm run build

      # Bundle live-update Capgo (ala Server Pulsa): zip dist/ -> update.zip di root repo.
      # Zip TIDAK masuk dist/ sehingga tidak ikut tersalin ke APK saat cap sync.
      - name: Build OTA Bundle (Capgo)
        run: node scripts/build-ota.js

      - name: Sync Capacitor Android
        run: |
          rm -f dist/update.zip
          npx cap sync android

      - name: Decode Keystore & Configure Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew

          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Memulai Build Android Release APK (Percobaan $RETRY_COUNT dari $MAX_RETRIES) ==="
            if ./gradlew assembleRelease -PversionCode=${{ steps.version_info.outputs.code }} -PversionName="${{ steps.version_info.outputs.name }}" --stacktrace; then
              SUCCESS=1
              break
            else
              echo "::warning::Percobaan $RETRY_COUNT gagal."
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Menunggu 60 detik sebelum mencoba kembali..."
                sleep 60
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Build Android Release APK gagal setelah $MAX_RETRIES percobaan."
            exit 1
          fi

          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk buku-konter-v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}.apk

      - name: Create GitHub Release with APK Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}"
          name: "Buku Konter v${{ steps.version_info.outputs.name }} (Build ${{ steps.version_info.outputs.code }})"
          body: |
            ### Pembaruan Buku Konter
            **Versi:** ${{ steps.version_info.outputs.name }}
            **Build Code:** ${{ steps.version_info.outputs.code }}

            ### Catatan Rilis:
            ${{ steps.version_info.outputs.changelog }}

            ---
            *Rilis dibuat otomatis oleh CI/CD GitHub Actions sesuai standar pola Setel.*
          files: |
            buku-konter-v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}.apk
            android/app/build/outputs/apk/release/app-release.apk
            update.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json with APK Download URL & Bundle Info & Commit
        run: |
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}/buku-konter-v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}.apk"
          BUNDLE_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version_info.outputs.name }}-b${{ steps.version_info.outputs.code }}/update.zip"
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const v = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            v.download_url = '$APK_DOWNLOAD_URL';
            v.bundle_url = '$BUNDLE_DOWNLOAD_URL';
            v.bundle_version = String(Date.now());
            if (!fs.existsSync('update.zip')) {
              console.error('ERROR: update.zip tidak ditemukan saat bot release dijalankan!');
              process.exit(1);
            }
            const zipBuffer = fs.readFileSync('update.zip');
            v.bundle_checksum = crypto.createHash('sha256').update(zipBuffer).digest('hex');
            fs.writeFileSync('version.json', JSON.stringify(v, null, 2) + '\n');
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): update version.json download_url & bundle info [skip ci]" && git push origin main)
